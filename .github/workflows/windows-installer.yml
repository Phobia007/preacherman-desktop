name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/preacherman-demo-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/preacherman-demo-host/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm run check
      - run: npm run build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: Preacherman-Windows-x64-setup
          path: apps/preacherman-demo-host/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
