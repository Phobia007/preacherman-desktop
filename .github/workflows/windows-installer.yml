name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "windows-v*"

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/preacherman-demo-host/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/preacherman-demo-host/src-tauri
      - name: Install and build local source packages
        run: powershell.exe -NoProfile -File tools/Setup-WindowsSource.ps1
      - run: node tools/check-release-source.mjs
      - name: Focused release checks
        working-directory: apps/preacherman-demo-host
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-concurrency=1 tests/runtime-installation.test.mjs tests/breeze-speech.test.mjs tests/local-speech-recognition.test.mjs tests/speech2motion-integration.test.mjs
      - name: Build self-contained Windows installer
        working-directory: apps/preacherman-demo-host
        run: npm run build:windows:installer
      - name: Assemble download artifacts
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item apps/preacherman-demo-host/src-tauri/target/release/bundle/nsis/*.exe release/Preacherman-Setup.exe
          Compress-Archive -Path deployment/windows/* -DestinationPath release/Preacherman-Services.zip
          Get-ChildItem release -File | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName).Hash.ToLowerInvariant(), $_.Name } | Set-Content release/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Preacherman-Windows-x64-setup
          path: release/*
          if-no-files-found: error
  draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Preacherman-Windows-x64-setup
          path: release
      - name: Create reviewable draft (native verification required before publication)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Preacherman $GITHUB_REF_NAME" --notes "Build artifacts only. Native installation, both themes, service setup and user-data isolation must be verified before publishing."
