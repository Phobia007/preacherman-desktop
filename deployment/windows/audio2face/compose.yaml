name: preacherman-audio2face
services:
  audio2face:
    image: dlp3d/audio2face@sha256:0376882ad687ba024b01554103a797aa849bd4763abc0323caf97e2dc4786517
    restart: unless-stopped
    command: ["--config_path", "configs/preacherman_cpu.py"]
    ports:
      - "127.0.0.1:18083:18083"
    volumes:
      - ./weights:/workspace/audio2face/weights:ro
      - ./configs/preacherman_cpu.py:/workspace/audio2face/configs/preacherman_cpu.py:ro
      - ./logs:/workspace/audio2face/logs
    environment:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      HF_HUB_OFFLINE: "1"
    cpus: 4
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18083/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
