706,709,711,714,717,720,723,726],{"title":698,"text":702},"\u003Cp>At gilhuybrecht.com, I respect your privacy and am committed to protecting your personal information. This Privacy Policy explains what information I collect, why I collect it, and how it is used.\u003C\u002Fp>",{"title":704,"text":705},"Who is responsible for your data?","\u003Cp>This website is operated by:\u003C\u002Fp>\u003Cp>Gil Huybrecht\u003Cbr>Belgian sole proprietorship (eenmanszaak)\u003Cbr>Email: \u003Ca href=\"mailto:hello@gilhuybrecht.com\">hello@gilhuybrecht.com\u003C\u002Fa>\u003C\u002Fp>\u003Cp>If you have any questions about this Privacy Policy or your personal data, you can contact me using the email address above.\u003C\u002Fp>",{"title":707,"text":708},"What information I collect","\u003Cp>If you choose to subscribe to my newsletter, I collect:\u003C\u002Fp>\u003Cul>\u003Cli>Your first name\u003C\u002Fli>\u003Cli>Your email address\u003C\u002Fli>\u003C\u002Ful>\u003Cp>Providing this information is entirely voluntary.\u003C\u002Fp>",{"title":508,"text":710},"\u003Cp>I use Mailchimp to manage and send my newsletter. By subscribing, your information is securely stored and processed by Mailchimp on my behalf.\u003C\u002Fp>\u003Cp>You can unsubscribe at any time by clicking the unsubscribe link included in every email.\u003C\u002Fp>",{"title":712,"text":713},"Analytics","\u003Cp>This website uses Google Analytics to better understand how visitors use the site. This information is collected in an aggregated manner and helps improve the website and its content.\u003C\u002Fp>\u003Cp>Google Analytics may collect information such as pages visited, approximate location, browser type and device information.\u003C\u002Fp>",{"title":715,"text":716},"How long I keep your data","\u003Cp>Your newsletter information is retained until you unsubscribe or request that it be deleted.\u003C\u002Fp>",{"title":718,"text":719},"Your rights","\u003Cp>If you are located in the European Economic Area (EEA), you have the right to:\u003C\u002Fp>\u003Cul>\u003Cli>Request access to your personal data\u003C\u002Fli>\u003Cli>Request correction of inaccurate information\u003C\u002Fli>\u003Cli>Request deletion of your personal data\u003C\u002Fli>\u003Cli>Restrict or object to certain processing\u003C\u002Fli>\u003Cli>Request a copy of your personal data\u003C\u002Fli>\u003C\u002Ful>\u003Cp>To exercise any of these rights, please email \u003Ca href=\"mailto:hello@gilhuybrecht.com\">hello@gilhuybrecht.com\u003C\u002Fa>.\u003C\u002Fp>",{"title":721,"text":722},"Data Security","\u003Cp>Reasonable technical and organisational measures are taken to protect your personal information from unauthorised access, misuse, or disclosure.\u003C\u002Fp>",{"title":724,"text":725},"Third-party services","\u003Cp>This website relies on the following third-party services:\u003C\u002Fp>\u003Cul>\u003Cli>Mailchimp (newsletter management)\u003C\u002Fli>\u003Cli>Google Analytics (website analytics)\u003C\u002Fli>\u003C\u002Ful>\u003Cp>These providers process data in accordance with their own privacy policies.\u003C\u002Fp>",{"title":727,"text":728},"Contact","\u003Cp>If you have any questions about this Privacy Policy or your personal data, please contact:\u003C\u002Fp>\u003Cp>Gil Huybrecht\u003Cbr>\u003Ca href=\"mailto:hello@gilhuybrecht.com\">hello@gilhuybrecht.com\u003C\u002Fa>\u003C\u002Fp>",[730,973,1166,1384,1545,1782,2038,2333,2541,2802,2947,3063,3269,3372,3497,3702,3893,4045,4226],{"slug":731,"title":732,"description":733,"link":734,"info":735,"media":754,"home":854},"studio-dado","Studio DADO","A refined website for Studio DADO, a boutique interior design firm shaping world class hospitality spaces for globally recognized brands, balancing craft, clarity, and confidence.","https:\u002F\u002Fwww.studiodado.com\u002F",{"id":736,"items":737},"fiu8ApdMRouSvT1LxQCXXw",[738,742,746,751],{"id":739,"label":740,"text":741,"link":26},"f6zXUM9bTcGpjTlr3uTSIQ","Dev","Jesper Westlund",{"id":743,"label":74
