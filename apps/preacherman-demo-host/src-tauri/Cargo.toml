[package]
name = "preacherman-demo-host"
version = "0.1.0"
description = "Minimal Tauri host for the first Preacherman Figma workspace surface"
authors = ["Preacherman"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "=2.4.10"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-single-instance = { version = "=2.4.4", features = ["deep-link"] }
