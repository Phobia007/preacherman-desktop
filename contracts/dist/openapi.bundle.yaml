components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token supplied as an HTTP Bearer credential.
  parameters:
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Optional client request identifier. Invalid values are replaced by the gateway.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^req_[A-Za-z0-9_-]+$
      example: req_example_001
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque key that identifies one user write intent.
      schema:
        type: string
        minLength: 16
        maxLength: 128
      example: idem_example_0001
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Revision validator obtained from the latest representation.
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: '"revision_12"'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by a previous list response.
      schema:
        type: string
        minLength: 1
        maxLength: 512
      example: cursor_example_001
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of records to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AfterSequence:
      name: after_sequence
      in: query
      required: false
      description: Replay events beginning after this sequence number.
      schema:
        type: integer
        minimum: 0
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Last SSE event ID applied by the client before reconnecting.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional opaque key used to make retries safe for this endpoint.
      schema:
        type: string
        minLength: 16
        maxLength: 128
      example: idem_example_0001
  headers:
    XRequestId:
      description: Final request identifier generated or accepted by the gateway.
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^req_[A-Za-z0-9_-]+$
      example: req_example_001
    RetryAfter:
      description: Seconds the client should wait before retrying the request.
      schema:
        type: integer
        minimum: 1
      example: 30
    Location:
      description: Relative URL of the created or accepted resource.
      schema:
        type: string
        pattern: ^/api/v1/
      example: /api/v1/operations/op_example_001
  schemas:
    Id:
      type: string
      minLength: 3
      maxLength: 128
      pattern: ^[A-Za-z][A-Za-z0-9_-]+$
    Timestamp:
      type: string
      format: date-time
    Session:
      type: object
      additionalProperties: false
      required:
        - session_id
        - user_id
        - expires_at
        - created_at
      properties:
        session_id:
          $ref: '#/components/schemas/Id'
        user_id:
          $ref: '#/components/schemas/Id'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        revoked_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    User:
      type: object
      additionalProperties: false
      required:
        - user_id
        - email
        - email_verified
        - account_status
        - onboarding_status
        - created_at
        - updated_at
      properties:
        user_id:
          $ref: '#/components/schemas/Id'
        email:
          type: string
          format: email
          maxLength: 320
        email_verified:
          type: boolean
        account_status:
          type: string
          enum:
            - pending
            - active
            - suspended
            - deleted
        onboarding_status:
          type: string
          enum:
            - not_started
            - in_progress
            - completed
        last_login_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    Revision:
      type: integer
      minimum: 0
    UserProfile:
      type: object
      additionalProperties: false
      required:
        - user_id
        - display_name
        - locale
        - timezone
        - preferences
        - revision
      properties:
        user_id:
          $ref: '#/components/schemas/Id'
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        avatar_asset_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        role_label:
          type:
            - string
            - 'null'
          maxLength: 120
        locale:
          type: string
          minLength: 2
          maxLength: 35
        timezone:
          type: string
