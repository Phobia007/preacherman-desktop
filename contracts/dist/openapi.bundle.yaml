            - retryable
            - details
          properties:
            code:
              type: string
              enum:
                - AUTH_INVALID_CREDENTIALS
                - AUTH_SESSION_EXPIRED
                - RESOURCE_FORBIDDEN
                - RESOURCE_NOT_FOUND
                - REVISION_CONFLICT
                - IDEMPOTENCY_CONFLICT
                - VALIDATION_FAILED
                - INSUFFICIENT_QUOTA
                - SOURCE_PARSE_FAILED
                - SOURCE_UNSAFE
                - UPLOAD_TOO_LARGE
                - UPLOAD_UNSUPPORTED_TYPE
                - UPLOAD_EXPIRED
                - UPLOAD_INCOMPLETE
                - UPLOAD_CHECKSUM_MISMATCH
