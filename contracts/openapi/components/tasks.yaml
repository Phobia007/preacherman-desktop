Source:
  type: object
  additionalProperties: false
  required:
    - source_id
    - owner_type
    - owner_id
    - source_type
    - title
    - scan_status
    - processing_status
    - parse_status
    - metadata
    - created_at
  properties:
    source_id:
      $ref: ./common.yaml#/Id
    owner_type:
      type: string
      enum: [task_draft, test_draft, skill_draft, conversation]
    owner_id:
      $ref: ./common.yaml#/Id
    upload_id:
      oneOf:
        - $ref: ./common.yaml#/Id
        - type: 'null'
    source_type:
      type: string
      enum: [file, text, url, repository, data_connector]
    title:
      type: string
      minLength: 1
      maxLength: 240
    original_filename:
      type: [string, 'null']
      maxLength: 255
    uri:
      type: [string, 'null']
      maxLength: 2048
      description: External source URI. Private object-storage locations are never returned.
    mime_type:
      type: [string, 'null']
      maxLength: 255
    size_bytes:
      type: [integer, 'null']
      minimum: 0
    scan_status:
      type: string
      enum: [not_required, pending, scanning, clean, blocked, failed]
    processing_status:
      type: string
      enum: [pending, scanning, parsing, ready, failed, unsafe]
    parse_status:
      type: string
      enum: [pending, parsing, ready, failed]
    parse_error_code:
      type: [string, 'null']
      maxLength: 80
    metadata:
      type: object
      additionalProperties: true
    created_at:
      $ref: ./common.yaml#/Timestamp
ContextTag:
  type: object
  additionalProperties: false
  required: [context_tag_id, owner_type, owner_id, label]
  properties:
    context_tag_id:
      $ref: ./common.yaml#/Id
    owner_type:
      type: string
      enum: [task_draft, test_draft, state_draft]
    owner_id:
      $ref: ./common.yaml#/Id
    label:
      type: string
      minLength: 1
      maxLength: 120
    value:
      type: [string, 'null']
      maxLength: 500
TaskDraft:
  type: object
  additionalProperties: false
  required:
    - task_draft_id
    - state_id
    - goal
    - description
    - source_ids
    - context_tags
    - template_id
    - status
    - revision
    - autosaved_at
    - created_at
    - updated_at
  properties:
    task_draft_id:
      $ref: ./common.yaml#/Id
    state_id:
      $ref: ./common.yaml#/Id
    conversation_id:
      oneOf:
        - $ref: ./common.yaml#/Id
        - type: 'null'
    goal:
      type: string
      minLength: 1
      maxLength: 4000
    description:
      type: string
      maxLength: 20000
    source_ids:
      type: array
      maxItems: 100
      items:
        $ref: ./common.yaml#/Id
    context_tags:
      type: array
      maxItems: 100
      items:
        $ref: '#/ContextTag'
    template_id:
      oneOf:
        - $ref: ./common.yaml#/Id
        - type: 'null'
    status:
      type: string
      enum: [editing, saved, submitted, discarded]
    revision:
      $ref: ./common.yaml#/Revision
    autosaved_at:
      oneOf:
        - $ref: ./common.yaml#/Timestamp
        - type: 'null'
    created_at:
      $ref: ./common.yaml#/Timestamp
    updated_at:
      $ref: ./common.yaml#/Timestamp
TaskTemplate:
  type: object
  additionalProperties: false
  required: [task_template_id, name, description, goal_template, context_tags]
  properties:
    task_template_id:
      $ref: ./common.yaml#/Id
    name:
      type: string
      minLength: 1
      maxLength: 160
    description:
      type: string
      maxLength: 1000
    goal_template:
      type: string
      maxLength: 4000
    context_tags:
      type: array
      maxItems: 30
      items:
        type: string
        maxLength: 120
TaskRunInputSnapshot:
  type: object
  additionalProperties: false
  readOnly: true
  description: Immutable input captured when the TaskRun is created.
  required: [task_draft_revision, goal, description, source_ids, context_tags, state_version_id]
  properties:
    task_draft_revision:
      $ref: ./common.yaml#/Revision
    goal:
      type: string
      maxLength: 4000
    description:
      type: string
      maxLength: 20000
    source_ids:
      type: array
      items:
        $ref: ./common.yaml#/Id
    context_tags:
      type: array
      items:
        $ref: '#/ContextTag'
    state_version_id:
      $ref: ./common.yaml#/Id
TaskRun:
  type: object
  additionalProperties: false
  required:
    - task_run_id
    - task_draft_id
    - state_version_id
    - input_snapshot
    - status
    - progress
    - artifact_ids
    - metrics
    - attempt
    - created_at
  properties:
    task_run_id:
      $ref: ./common.yaml#/Id
    task_draft_id:
      $ref: ./common.yaml#/Id
    state_version_id:
      $ref: ./common.yaml#/Id
    previous_task_run_id:
      oneOf:
        - $ref: ./common.yaml#/Id
        - type: 'null'
    input_snapshot:
      $ref: '#/TaskRunInputSnapshot'
    status:
      type: string
      enum: [queued, running, succeeded, failed, cancelled, timed_out]
    current_stage:
      type: [string, 'null']
      maxLength: 80
    progress:
      type: number
      minimum: 0
      maximum: 1
    error_code:
      type: [string, 'null']
      maxLength: 80
    artifact_ids:
      type: array
      items:
        $ref: ./common.yaml#/Id
    metrics:
      type: object
      additionalProperties: true
    attempt:
      type: integer
      minimum: 1
    started_at:
      oneOf:
        - $ref: ./common.yaml#/Timestamp
        - type: 'null'
    completed_at:
      oneOf:
        - $ref: ./common.yaml#/Timestamp
        - type: 'null'
    created_at:
      $ref: ./common.yaml#/Timestamp
Artifact:
  type: object
  additionalProperties: false
  description: Artifact metadata. Private storage keys are intentionally excluded.
  required:
    - artifact_id
    - owner_type
    - owner_id
    - artifact_type
    - title
    - filename
    - mime_type
    - size_bytes
    - scan_status
    - preview_status
    - retention_class
    - metadata
    - created_at
  properties:
    artifact_id:
      $ref: ./common.yaml#/Id
    owner_type:
      type: string
      enum: [task_run, test_run, validation_run]
    owner_id:
      $ref: ./common.yaml#/Id
    artifact_type:
      type: string
      enum: [document, data, image, archive, trace]
    title:
      type: string
      minLength: 1
      maxLength: 240
    filename:
      type: string
      minLength: 1
      maxLength: 255
    mime_type:
      type: string
      maxLength: 255
    size_bytes:
      type: integer
      minimum: 0
    scan_status:
      type: string
      enum: [pending, scanning, clean, blocked, failed]
    preview_status:
      type: string
      enum: [pending, ready, failed]
    preview_artifact_id:
      oneOf:
        - $ref: ./common.yaml#/Id
        - type: 'null'
    retention_class:
      type: string
      enum: [temporary, draft, workspace, versioned, audit]
    metadata:
      type: object
      additionalProperties: true
    created_at:
      $ref: ./common.yaml#/Timestamp
    expires_at:
      oneOf:
        - $ref: ./common.yaml#/Timestamp
        - type: 'null'
UpdateTaskDraftRequest:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    goal:
      type: string
      minLength: 1
      maxLength: 4000
    description:
      type: string
      maxLength: 20000
    status:
      type: string
      enum: [editing, saved, discarded]
ApplyTaskTemplateRequest:
  type: object
  additionalProperties: false
  required: [task_template_id, draft_revision]
  properties:
    task_template_id:
      $ref: ./common.yaml#/Id
    draft_revision:
      $ref: ./common.yaml#/Revision
AddTaskDraftSourceRequest:
  type: object
  additionalProperties: false
  required: [source_type, title, draft_revision]
  properties:
    source_type:
      type: string
      enum: [file, text, url, repository, data_connector]
    title:
      type: string
      minLength: 1
      maxLength: 240
    upload_id:
      $ref: ./common.yaml#/Id
    text:
      type: string
      maxLength: 100000
    uri:
      type: string
      format: uri
      maxLength: 2048
    draft_revision:
      $ref: ./common.yaml#/Revision
AddTaskContextTagRequest:
  type: object
  additionalProperties: false
  required: [label, draft_revision]
  properties:
    label:
      type: string
      minLength: 1
      maxLength: 120
    value:
      type: [string, 'null']
      maxLength: 500
    draft_revision:
      $ref: ./common.yaml#/Revision
TaskDraftActionRequest:
  type: object
  additionalProperties: false
  required: [action_type, draft_revision]
  properties:
    action_type:
      type: string
      enum: [clarify_intent, expand_context, check_alignment, simulate_outcome]
    draft_revision:
      $ref: ./common.yaml#/Revision
CreateTaskRunRequest:
  type: object
  additionalProperties: false
  required: [task_draft_id, draft_revision, state_version_id]
  properties:
    task_draft_id:
      $ref: ./common.yaml#/Id
    draft_revision:
      $ref: ./common.yaml#/Revision
    state_version_id:
      $ref: ./common.yaml#/Id
RetryTaskRunRequest:
  type: object
  additionalProperties: false
  properties:
    reason:
      type: [string, 'null']
      maxLength: 500
RefineTaskDraftRequest:
  type: object
  additionalProperties: false
  required: [instructions]
  properties:
    instructions:
      type: string
      minLength: 1
      maxLength: 4000
CreateStateAdjustmentDraftRequest:
  type: object
  additionalProperties: false
  required: [improvement_item_ids]
  properties:
    improvement_item_ids:
      type: array
      minItems: 1
      maxItems: 100
      items:
        $ref: ./common.yaml#/Id
TaskDraftResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data:
      $ref: '#/TaskDraft'
    meta:
      $ref: ./common.yaml#/RequestMeta
TaskDraftDetailResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data:
      type: object
      additionalProperties: false
      required: [task_draft, sources]
      properties:
        task_draft:
          $ref: '#/TaskDraft'
        sources:
          type: array
          items:
            $ref: '#/Source'
    meta:
      $ref: ./common.yaml#/RequestMeta
TaskTemplateListResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data:
      type: array
      items:
        $ref: '#/TaskTemplate'
    meta:
      $ref: ./common.yaml#/ListMeta
SourceAcceptedResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data:
      type: object
      additionalProperties: false
      required: [source, draft_revision, operation]
      properties:
        source:
          $ref: '#/Source'
        draft_revision:
          $ref: ./common.yaml#/Revision
        operation:
          $ref: ./common.yaml#/OperationAccepted
    meta:
      $ref: ./common.yaml#/RequestMeta
ContextTagResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data:
      type: object
      additionalProperties: false
      required: [context_tag, draft_revision]
      properties:
        context_tag:
          $ref: '#/ContextTag'
        draft_revision:
          $ref: ./common.yaml#/Revision
    meta:
      $ref: ./common.yaml#/RequestMeta
RevisionResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision:
          $ref: ./common.yaml#/Revision
    meta:
      $ref: ./common.yaml#/RequestMeta
CreateTaskRunAcceptedResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data:
      type: object
      additionalProperties: false
      required: [task_run_id, operation]
      properties:
        task_run_id:
          $ref: ./common.yaml#/Id
        operation:
          $ref: ./common.yaml#/OperationAccepted
    meta:
      $ref: ./common.yaml#/RequestMeta
RetryTaskRunAcceptedResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data:
      type: object
      additionalProperties: false
      required: [task_run_id, previous_task_run_id, operation]
      properties:
        task_run_id:
          $ref: ./common.yaml#/Id
        previous_task_run_id:
          $ref: ./common.yaml#/Id
        operation:
          $ref: ./common.yaml#/OperationAccepted
    meta:
      $ref: ./common.yaml#/RequestMeta
TaskRunResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data:
      $ref: '#/TaskRun'
    meta:
      $ref: ./common.yaml#/RequestMeta
TaskRunResultResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data:
      type: object
      additionalProperties: false
      required: [task_run, artifacts, summary]
      properties:
        task_run:
          $ref: '#/TaskRun'
        artifacts:
          type: array
          items:
            $ref: '#/Artifact'
        summary:
          type: string
          maxLength: 4000
    meta:
      $ref: ./common.yaml#/RequestMeta
ArtifactDownloadResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data:
      type: object
      additionalProperties: false
      required: [artifact_id, download_url, expires_at, filename, mime_type]
      properties:
        artifact_id:
          $ref: ./common.yaml#/Id
        download_url:
          type: string
          format: uri
          description: Short-lived download URL. The example is intentionally unsigned.
        expires_at:
          $ref: ./common.yaml#/Timestamp
        filename:
          type: string
          maxLength: 255
        mime_type:
          type: string
          maxLength: 255
    meta:
      $ref: ./common.yaml#/RequestMeta
