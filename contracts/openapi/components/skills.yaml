      maximum: 5
    name:
      type: string
      minLength: 1
      maxLength: 160
    purpose:
      type: string
      maxLength: 10000
    category:
      type: string
      maxLength: 120
    capabilities:
      type: array
      maxItems: 100
      items:
        $ref: '#/SkillCapability'
    behavior:
      type: object
      additionalProperties: true
    guardrails:
      type: object
      additionalProperties: true
    permissions:
      type: array
      maxItems: 100
      items:
        $ref: '#/SkillPermissionDeclaration'
    output_contract:
      type: object
      additionalProperties: true
UpdateSkillDraftFileRequest:
  type: object
  additionalProperties: false
  required: [content, content_hash, file_revision]
