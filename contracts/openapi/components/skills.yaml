  properties:
    version:
      type: string
      minLength: 1
      maxLength: 32
    draft_revision:
      $ref: ./common.yaml#/Revision
    validation_run_id:
      $ref: ./common.yaml#/Id
    destination:
      type: object
      additionalProperties: false
      required: [state_draft_id, state_draft_revision]
      properties:
        state_draft_id:
          $ref: ./common.yaml#/Id
        state_draft_revision:
          $ref: ./common.yaml#/Revision
        position:
          type: integer
          minimum: 0
        configuration:
          type: object
          additionalProperties: true
CreateExportableSkillVersionRequest:
  type: object
  additionalProperties: false
