  required: [selected_capability_ids]
  properties:
    selected_capability_ids:
      type: array
      maxItems: 100
      uniqueItems: true
      items:
        $ref: ./common.yaml#/Id
CreateValidationRunRequest:
  type: object
  additionalProperties: false
  required: [draft_revision, test_set_ids, mode]
  properties:
    draft_revision:
      $ref: ./common.yaml#/Revision
    test_set_ids:
      type: array
      minItems: 1
      maxItems: 100
      uniqueItems: true
      items:
        $ref: ./common.yaml#/Id
    mode:
      type: string
      enum: [quick, full, regression]
CreateSkillTestSetRequest:
  type: object
  additionalProperties: false
  required: [mode]
