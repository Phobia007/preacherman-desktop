openapi: 3.1.0
info:
  title: Preacherman Product API
  version: 1.0.0
  description: Machine-readable contract for the Preacherman application.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: Current API base path
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Authentication, sessions, profiles, and notifications.
  - name: Home
    description: Home summaries and current State entry points.
  - name: Monitor
    description: State health, usage, runtime status, and live monitoring.
  - name: Conversations
    description: Conversations, messages, streaming replies, sharing, and exports.
  - name: Tasks
    description: Task drafts, task runs, results, and artifacts.
  - name: StateLab
    description: State drafts, recommendations, skill mounts, and Lab testing.
  - name: Skills
    description: Skill creation, import, configuration, validation, and publishing.
  - name: StateTests
    description: State test drafts, runs, results, and workspace actions.
  - name: Market
    description: State discovery, matching, passports, sandboxing, and installation.
  - name: Ledger
    description: State versions, branches, restores, evolution, and timelines.
  - name: Uploads
    description: Shared upload sessions, Source processing, and runtime event access.
